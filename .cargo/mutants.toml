# cargo-mutants: https://mutants.rs. Run with `just mutants` (whole tree) or
# `just mutants-diff` (only code changed since origin/main).
test_tool = "nextest"
# The compat replay takes ~9s alone but nearly 30s with several mutants building at
# once, so allow 2 minutes. This is a backstop: the nextest `mutants` profile
# (.config/nextest.toml) terminates hung tests sooner, which counts as caught.
timeout_multiplier = 3.0
minimum_test_timeout = 120
# Stop at the first failing test: once one fails the mutant is caught, and waiting
# on the slow compat replay would turn that into a timeout.
additional_cargo_test_args = ["--max-fail=1:immediate", "--profile", "mutants"]

# Mutants that cannot change behaviour, each with the reason.
exclude_re = [
    # PREFIX and `unix_secs << 16` occupy disjoint bits, so `|`, `^` and `+` agree.
    'src/xact\.rs:.*: replace \| with \^ in floor_at',
]
