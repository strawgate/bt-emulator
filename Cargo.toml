[package]
name = "bt-emulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline emulator for the Braintrust API"
license = "Apache-2.0"
repository = "https://github.com/strawgate/bt-emulator"
readme = "README.md"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1"
form_urlencoded = "1.2.2"
hex = "0.4"
jsonschema = { version = "0.61", default-features = false }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["any", "sqlite", "postgres", "runtime-tokio", "migrate", "macros", "tls-none"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
